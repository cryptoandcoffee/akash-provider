name: Test Build Methods (One-Time Test)

# This workflow tests multiple container build methods to determine
# which ones work with containerized self-hosted GitHub Actions runners.
#
# MANUAL TRIGGER ONLY - Run once to find working build method
# Results will show which methods work without Docker daemon access
#
# Each job builds its own binary (NO ARTIFACTS - saves quota and is faster)

on:
  workflow_dispatch:
    inputs:
      test_all:
        description: 'Test all methods (yes/no)'
        required: false
        default: 'yes'

env:
  UPSTREAM_REPO: akash-network/provider

jobs:
  # TEST 1: Kaniko (Highest Priority - Designed for Containerized Environments)
  test-kaniko:
    runs-on: self-hosted
    continue-on-error: true
    steps:
      - name: Clone upstream and detect Go version
        run: |
          rm -rf /tmp/test-kaniko
          mkdir -p /tmp/test-kaniko
          cd /tmp/test-kaniko

          git clone --depth 1 --branch main https://github.com/${{ env.UPSTREAM_REPO }}.git upstream
          cd upstream

          toolchain=$(./script/tools.sh gotoolchain | sed 's/go*//')
          echo "GOVERSION=${toolchain}" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOVERSION }}

      - name: Build binary
        working-directory: /tmp/test-kaniko/upstream
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -tags "osusergo,netgo,static_build" \
            -ldflags="-s -w -extldflags=-static" \
            -o ./provider-services \
            ./cmd/provider-services

          chmod +x ./provider-services
          ls -lh provider-services

      - name: Create test Dockerfile
        working-directory: /tmp/test-kaniko/upstream
        run: |
          cat > Dockerfile << 'EOF'
          FROM ubuntu:noble
          COPY provider-services /usr/bin/
          RUN apt-get update && apt-get install -y curl tini jq bc netcat-traditional mawk ca-certificates pci.ids && rm -rf /var/lib/apt/lists/*
          ENTRYPOINT ["/usr/bin/tini", "--"]
          CMD ["provider-services", "--help"]
          EOF

      - name: Install and test Kaniko
        working-directory: /tmp/test-kaniko/upstream
        run: |
          set -x

          # Download kaniko executor (latest version)
          curl -sSL https://github.com/GoogleContainerTools/kaniko/releases/download/v1.24.0/executor-linux-amd64 -o /tmp/kaniko
          chmod +x /tmp/kaniko

          # Try to build with kaniko
          /tmp/kaniko \
            --dockerfile=Dockerfile \
            --context=. \
            --destination=test-kaniko:latest \
            --no-push \
            --tar-path=/tmp/test-kaniko.tar

          echo "✅ KANIKO BUILD SUCCEEDED" >> $GITHUB_STEP_SUMMARY
          ls -lh /tmp/test-kaniko.tar
        continue-on-error: true

      - name: Report result
        if: always()
        run: |
          if [ -f /tmp/test-kaniko.tar ]; then
            echo "## ✅ Kaniko: SUCCESS" >> $GITHUB_STEP_SUMMARY
            echo "Image built successfully and saved to tar" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Kaniko: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "Could not build image" >> $GITHUB_STEP_SUMMARY
          fi

  # TEST 2: Buildah (High Priority - Red Hat's Daemonless Builder)
  test-buildah:
    runs-on: self-hosted
    continue-on-error: true
    steps:
      - name: Clone upstream and detect Go version
        run: |
          rm -rf /tmp/test-buildah
          mkdir -p /tmp/test-buildah
          cd /tmp/test-buildah

          git clone --depth 1 --branch main https://github.com/${{ env.UPSTREAM_REPO }}.git upstream
          cd upstream

          toolchain=$(./script/tools.sh gotoolchain | sed 's/go*//')
          echo "GOVERSION=${toolchain}" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOVERSION }}

      - name: Build binary
        working-directory: /tmp/test-buildah/upstream
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -tags "osusergo,netgo,static_build" \
            -ldflags="-s -w -extldflags=-static" \
            -o ./provider-services \
            ./cmd/provider-services

          chmod +x ./provider-services

      - name: Create test Dockerfile
        working-directory: /tmp/test-buildah/upstream
        run: |
          cat > Dockerfile << 'EOF'
          FROM ubuntu:noble
          COPY provider-services /usr/bin/
          RUN apt-get update && apt-get install -y curl tini jq bc netcat-traditional mawk ca-certificates pci.ids && rm -rf /var/lib/apt/lists/*
          ENTRYPOINT ["/usr/bin/tini", "--"]
          CMD ["provider-services", "--help"]
          EOF

      - name: Install and test Buildah
        working-directory: /tmp/test-buildah/upstream
        run: |
          set -x

          # Try to install buildah
          sudo apt-get update
          sudo apt-get install -y buildah || echo "Failed to install via apt"

          # Verify installation
          buildah --version || exit 1

          # Try to build with buildah
          buildah bud -t test-buildah:latest .

          echo "✅ BUILDAH BUILD SUCCEEDED" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Report result
        if: always()
        run: |
          if buildah images 2>/dev/null | grep -q test-buildah; then
            echo "## ✅ Buildah: SUCCESS" >> $GITHUB_STEP_SUMMARY
            buildah images | grep test-buildah >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Buildah: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

  # TEST 3: BuildKit Daemonless (High Priority - Ephemeral BuildKit)
  test-buildkit-daemonless:
    runs-on: self-hosted
    continue-on-error: true
    steps:
      - name: Clone upstream and detect Go version
        run: |
          rm -rf /tmp/test-buildkit-daemonless
          mkdir -p /tmp/test-buildkit-daemonless
          cd /tmp/test-buildkit-daemonless

          git clone --depth 1 --branch main https://github.com/${{ env.UPSTREAM_REPO }}.git upstream
          cd upstream

          toolchain=$(./script/tools.sh gotoolchain | sed 's/go*//')
          echo "GOVERSION=${toolchain}" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOVERSION }}

      - name: Build binary
        working-directory: /tmp/test-buildkit-daemonless/upstream
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -tags "osusergo,netgo,static_build" \
            -ldflags="-s -w -extldflags=-static" \
            -o ./provider-services \
            ./cmd/provider-services

          chmod +x ./provider-services

      - name: Create test Dockerfile
        working-directory: /tmp/test-buildkit-daemonless/upstream
        run: |
          cat > Dockerfile << 'EOF'
          FROM ubuntu:noble
          COPY provider-services /usr/bin/
          RUN apt-get update && apt-get install -y curl tini jq bc netcat-traditional mawk ca-certificates pci.ids && rm -rf /var/lib/apt/lists/*
          ENTRYPOINT ["/usr/bin/tini", "--"]
          CMD ["provider-services", "--help"]
          EOF

      - name: Install and test BuildKit Daemonless
        working-directory: /tmp/test-buildkit-daemonless/upstream
        run: |
          set -x

          # Download buildkit
          curl -sSL https://github.com/moby/buildkit/releases/download/v0.18.2/buildkit-v0.18.2.linux-amd64.tar.gz -o buildkit.tar.gz
          tar xzf buildkit.tar.gz

          # Move binaries and scripts to /usr/local/bin
          sudo cp -a bin/* /usr/local/bin/
          sudo chmod +x /usr/local/bin/*

          # Verify installation
          buildctl --version
          ls -la /usr/local/bin/buildctl-daemonless.sh

          # Try daemonless build using full path
          /usr/local/bin/buildctl-daemonless.sh build \
            --frontend dockerfile.v0 \
            --local context=. \
            --local dockerfile=. \
            --output type=oci,dest=/tmp/test-buildkit-daemonless.tar

          echo "✅ BUILDKIT DAEMONLESS BUILD SUCCEEDED" >> $GITHUB_STEP_SUMMARY
          ls -lh /tmp/test-buildkit-daemonless.tar
        continue-on-error: true

      - name: Report result
        if: always()
        run: |
          if [ -f /tmp/test-buildkit-daemonless.tar ]; then
            echo "## ✅ BuildKit Daemonless: SUCCESS" >> $GITHUB_STEP_SUMMARY
            ls -lh /tmp/test-buildkit-daemonless.tar >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ BuildKit Daemonless: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

  # TEST 4: Podman (High Priority - Daemonless by Default)
  test-podman:
    runs-on: self-hosted
    continue-on-error: true
    steps:
      - name: Clone upstream and detect Go version
        run: |
          rm -rf /tmp/test-podman
          mkdir -p /tmp/test-podman
          cd /tmp/test-podman

          git clone --depth 1 --branch main https://github.com/${{ env.UPSTREAM_REPO }}.git upstream
          cd upstream

          toolchain=$(./script/tools.sh gotoolchain | sed 's/go*//')
          echo "GOVERSION=${toolchain}" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOVERSION }}

      - name: Build binary
        working-directory: /tmp/test-podman/upstream
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -tags "osusergo,netgo,static_build" \
            -ldflags="-s -w -extldflags=-static" \
            -o ./provider-services \
            ./cmd/provider-services

          chmod +x ./provider-services

      - name: Create test Dockerfile
        working-directory: /tmp/test-podman/upstream
        run: |
          cat > Dockerfile << 'EOF'
          FROM ubuntu:noble
          COPY provider-services /usr/bin/
          RUN apt-get update && apt-get install -y curl tini jq bc netcat-traditional mawk ca-certificates pci.ids && rm -rf /var/lib/apt/lists/*
          ENTRYPOINT ["/usr/bin/tini", "--"]
          CMD ["provider-services", "--help"]
          EOF

      - name: Install and test Podman
        working-directory: /tmp/test-podman/upstream
        run: |
          set -x

          # Try to install podman
          sudo apt-get update
          sudo apt-get install -y podman || echo "Failed to install via apt"

          # Verify installation
          podman --version || exit 1

          # Try to build with podman
          podman build -t test-podman:latest .

          echo "✅ PODMAN BUILD SUCCEEDED" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Report result
        if: always()
        run: |
          if podman images 2>/dev/null | grep -q test-podman; then
            echo "## ✅ Podman: SUCCESS" >> $GITHUB_STEP_SUMMARY
            podman images | grep test-podman >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Podman: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

  # TEST 5: Docker Build (Expected to Fail - Baseline)
  test-docker-build:
    runs-on: self-hosted
    continue-on-error: true
    steps:
      - name: Clone upstream and detect Go version
        run: |
          rm -rf /tmp/test-docker
          mkdir -p /tmp/test-docker
          cd /tmp/test-docker

          git clone --depth 1 --branch main https://github.com/${{ env.UPSTREAM_REPO }}.git upstream
          cd upstream

          toolchain=$(./script/tools.sh gotoolchain | sed 's/go*//')
          echo "GOVERSION=${toolchain}" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOVERSION }}

      - name: Build binary
        working-directory: /tmp/test-docker/upstream
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -tags "osusergo,netgo,static_build" \
            -ldflags="-s -w -extldflags=-static" \
            -o ./provider-services \
            ./cmd/provider-services

          chmod +x ./provider-services

      - name: Create test Dockerfile
        working-directory: /tmp/test-docker/upstream
        run: |
          cat > Dockerfile << 'EOF'
          FROM ubuntu:noble
          COPY provider-services /usr/bin/
          RUN apt-get update && apt-get install -y curl tini jq bc netcat-traditional mawk ca-certificates pci.ids && rm -rf /var/lib/apt/lists/*
          ENTRYPOINT ["/usr/bin/tini", "--"]
          CMD ["provider-services", "--help"]
          EOF

      - name: Test Docker Build (Expected to Fail)
        working-directory: /tmp/test-docker/upstream
        run: |
          set -x

          # This is expected to fail with "Cannot connect to the Docker daemon"
          docker build -t test-docker:latest . 2>&1 | tee /tmp/docker-error.log || true

          if grep -q "Cannot connect to the Docker daemon" /tmp/docker-error.log; then
            echo "## ❌ Docker Build: FAILED (Expected)" >> $GITHUB_STEP_SUMMARY
            echo "Error: Cannot connect to Docker daemon" >> $GITHUB_STEP_SUMMARY
            echo "This confirms we need an alternative build method" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ✅ Docker Build: UNEXPECTED SUCCESS" >> $GITHUB_STEP_SUMMARY
            echo "Docker daemon is accessible!" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

  # Summary job - Collect all results
  test-summary:
    needs:
      - test-kaniko
      - test-buildah
      - test-buildkit-daemonless
      - test-podman
      - test-docker-build
    runs-on: self-hosted
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "# 🧪 Container Build Methods Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This workflow tested multiple container build methods to find which work" >> $GITHUB_STEP_SUMMARY
          echo "with containerized self-hosted GitHub Actions runners." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**No artifacts used - each job built its own binary for faster execution**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Review individual job results above to see which methods succeeded." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Recommended Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Identify which method(s) passed" >> $GITHUB_STEP_SUMMARY
          echo "2. Update main workflow to use the working method" >> $GITHUB_STEP_SUMMARY
          echo "3. Priority recommendations:" >> $GITHUB_STEP_SUMMARY
          echo "   - **Kaniko**: Best for containerized CI (no daemon needed)" >> $GITHUB_STEP_SUMMARY
          echo "   - **Buildah**: Fast, production-ready (Red Hat)" >> $GITHUB_STEP_SUMMARY
          echo "   - **BuildKit Daemonless**: Modern, efficient caching" >> $GITHUB_STEP_SUMMARY
          echo "   - **Podman**: Drop-in Docker replacement" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Kaniko: ${{ needs.test-kaniko.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Buildah: ${{ needs.test-buildah.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- BuildKit Daemonless: ${{ needs.test-buildkit-daemonless.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Podman: ${{ needs.test-podman.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Docker Build (baseline): ${{ needs.test-docker-build.result }}" >> $GITHUB_STEP_SUMMARY
