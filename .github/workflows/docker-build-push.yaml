name: Docker Build and Push

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream git ref to build (branch, tag, or commit SHA)'
        required: false
        default: 'main'
      tag_as_latest:
        description: 'Tag this build as latest'
        required: false
        type: boolean
        default: false

env:
  DOCKER_CLI_EXPERIMENTAL: "enabled"
  DOCKERHUB_IMAGE: cryptoandcoffee/akash-network-provider
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/akash-network-provider
  UPSTREAM_REPO: akash-network/provider

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - name: Determine upstream ref to build
        id: determine_ref
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            REF="${{ github.event.inputs.upstream_ref }}"
          else
            # For push events, build from upstream main
            REF="main"
          fi
          echo "ref=${REF}" >> $GITHUB_OUTPUT
          echo "📍 Building from upstream ref: ${REF}" >> $GITHUB_STEP_SUMMARY

      - name: Clone upstream provider
        run: |
          if git clone --depth 1 --branch ${{ steps.determine_ref.outputs.ref }} https://github.com/${{ env.UPSTREAM_REPO }}.git upstream; then
            echo "Shallow clone succeeded"
          else
            echo "Shallow clone failed, trying full clone"
            rm -rf upstream
            git clone https://github.com/${{ env.UPSTREAM_REPO }}.git upstream
            cd upstream
            git checkout ${{ steps.determine_ref.outputs.ref }}
            cd ..
          fi
          cd upstream
          echo "UPSTREAM_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "📦 Cloned upstream at $(git rev-parse --short HEAD)" >> $GITHUB_STEP_SUMMARY

      - name: Detect required Go version
        working-directory: ./upstream
        run: |
          toolchain=$(./script/tools.sh gotoolchain | sed 's/go*//')
          echo "GOVERSION=${toolchain}" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOVERSION }}

      - name: Install buildah
        run: |
          if ! command -v buildah &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y buildah
          fi
          buildah --version

      - name: Generate build metadata
        run: |
          echo "BUILD_DATE=$(date -u +'%Y%m%d')" >> $GITHUB_ENV
          echo "BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "COMMIT_SHA=${{ env.UPSTREAM_SHA }}" >> $GITHUB_ENV

          # Determine ref type and version
          REF="${{ steps.determine_ref.outputs.ref }}"
          if [[ "$REF" == refs/tags/* ]] || [[ "$REF" =~ ^v[0-9] ]]; then
            if [[ "$REF" == refs/tags/* ]]; then
              VERSION=${REF#refs/tags/}
            else
              VERSION=$REF
            fi
            echo "VERSION=${VERSION}" >> $GITHUB_ENV
            echo "IS_TAG=true" >> $GITHUB_ENV
            echo "🏷️ Building version: ${VERSION}" >> $GITHUB_STEP_SUMMARY
          else
            echo "IS_TAG=false" >> $GITHUB_ENV
            echo "🔨 Building from branch: ${REF}" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build binary
        working-directory: ./upstream
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -tags "osusergo,netgo,static_build" \
            -ldflags="-s -w -extldflags=-static" \
            -o ./bin/provider-services \
            ./cmd/provider-services

          chmod +x ./bin/provider-services

      - name: Check out tracking repo for Dockerfile
        uses: actions/checkout@v4
        with:
          path: dockerfile-repo
          fetch-depth: 1

      - name: Build and push container
        working-directory: ./upstream
        run: |
          # Copy Dockerfile from tracking repo
          cp ../dockerfile-repo/Dockerfile ./

          if [ "${{ env.IS_TAG }}" == "true" ]; then
            # Build for releases
            echo "🚀 Pushing release: ${VERSION}" >> $GITHUB_STEP_SUMMARY

            buildah bud \
              --isolation chroot \
              --build-arg BINARY=bin/provider-services \
              --tag ${DOCKERHUB_IMAGE}:${VERSION} \
              --tag ${GHCR_IMAGE}:${VERSION} \
              .

            # Push version tags
            buildah push --creds "${{ secrets.DOCKERHUB_USERNAME }}:${{ secrets.DOCKERHUB_TOKEN }}" ${DOCKERHUB_IMAGE}:${VERSION}
            buildah push --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" ${GHCR_IMAGE}:${VERSION}

            if [ "${{ github.event.inputs.tag_as_latest }}" == "true" ]; then
              # Tag and push as latest
              buildah tag ${DOCKERHUB_IMAGE}:${VERSION} ${DOCKERHUB_IMAGE}:latest
              buildah tag ${GHCR_IMAGE}:${VERSION} ${GHCR_IMAGE}:latest
              buildah push --creds "${{ secrets.DOCKERHUB_USERNAME }}:${{ secrets.DOCKERHUB_TOKEN }}" ${DOCKERHUB_IMAGE}:latest
              buildah push --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" ${GHCR_IMAGE}:latest
              echo "✅ Tagged as latest" >> $GITHUB_STEP_SUMMARY
            fi
          else
            # Build for main branch
            echo "🚀 Pushing main branch build" >> $GITHUB_STEP_SUMMARY

            buildah bud \
              --isolation chroot \
              --build-arg BINARY=bin/provider-services \
              --tag ${DOCKERHUB_IMAGE}:main \
              --tag ${GHCR_IMAGE}:main \
              .

            # Push main tags
            buildah push --creds "${{ secrets.DOCKERHUB_USERNAME }}:${{ secrets.DOCKERHUB_TOKEN }}" ${DOCKERHUB_IMAGE}:main
            buildah push --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" ${GHCR_IMAGE}:main
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Published Images" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Hub: \`${DOCKERHUB_IMAGE}\`" >> $GITHUB_STEP_SUMMARY
          echo "### GHCR: \`${GHCR_IMAGE}\`" >> $GITHUB_STEP_SUMMARY

      - name: Check out tracking repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README with published versions
        run: |
          # Determine what was published
          if [ "${{ env.IS_TAG }}" == "true" ]; then
            LATEST_TAG="${{ env.VERSION }}"
            BUILD_DATE="$(date -u +'%Y-%m-%d %H:%M UTC')"
            MAIN_SHA="N/A"
          else
            # For main branch builds, get latest tag from GitHub
            LATEST_TAG=$(curl -s https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/tags | jq -r '.[0].name')
            BUILD_DATE="$(date -u +'%Y-%m-%d %H:%M UTC')"
            MAIN_SHA="$(echo ${{ env.UPSTREAM_SHA }} | cut -c1-7)"
          fi

          # Create a badge-style status line
          cat > /tmp/readme-update.txt << EOF

          ---

          **Last Updated**: ${BUILD_DATE}
          **Latest Release**: \`${LATEST_TAG}\` | **Main Branch**: \`${MAIN_SHA}\`

          EOF

          # Check if the status section exists, if not append it
          if grep -q "^---$" README.md && grep -q "Last Updated" README.md; then
            # Replace existing status section (from first --- to end of file)
            sed -i '/^---$/,$d' README.md
            cat /tmp/readme-update.txt >> README.md
          else
            # Append new status section
            cat /tmp/readme-update.txt >> README.md
          fi

      - name: Commit README updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No README changes to commit"
          else
            git commit -m "docs: update README with published versions [skip ci]"
            git push
            echo "✅ README updated with latest versions" >> $GITHUB_STEP_SUMMARY
          fi
