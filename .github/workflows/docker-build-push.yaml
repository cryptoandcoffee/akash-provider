name: Docker Build and Push

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  repository_dispatch:
    types: [upstream-sync, release-build]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch or tag)'
        required: false
        default: 'main'
      tag_as_latest:
        description: 'Tag this build as latest'
        required: false
        type: boolean
        default: false

env:
  DOCKER_CLI_EXPERIMENTAL: "enabled"
  DOCKERHUB_IMAGE: cryptoandcoffee/akash-network-provider
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/akash-network-provider

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      # 1. Checkout code with full history
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.event.client_payload.ref || github.ref }}

      # 2. Detect required Go version
      - name: Detect required Go version
        run: |
          toolchain=$(./script/tools.sh gotoolchain | sed 's/go*//')
          echo "GOVERSION=${toolchain}" >> $GITHUB_ENV

      # 3. Set up Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOVERSION }}

      # 4. Install Docker client
      - name: Install Docker client
        run: |
          if ! command -v docker &> /dev/null; then
            curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-24.0.7.tgz -o docker.tgz
            tar xzvf docker.tgz --strip 1 -C /usr/local/bin docker/docker
            rm docker.tgz
          fi
          docker version --format '{{.Client.Version}}'

      # 5. Set up Docker Buildx with remote builder
      - name: Set up Docker Buildx with remote builder
        run: |
          mkdir -p ~/.docker/cli-plugins/
          curl -SL https://github.com/docker/buildx/releases/download/v0.11.2/buildx-v0.11.2.linux-amd64 -o ~/.docker/cli-plugins/docker-buildx
          chmod +x ~/.docker/cli-plugins/docker-buildx

          # Use docker-container driver which runs buildkit in a container
          docker buildx create --use --name container-builder --driver docker-container || true
          docker buildx use container-builder || true

      # 6. Log in to Docker Hub
      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # 7. Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # 8. Generate build metadata
      - name: Generate build metadata
        run: |
          echo "BUILD_DATE=$(date -u +'%Y%m%d')" >> $GITHUB_ENV
          echo "BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "COMMIT_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

          # Determine ref type
          REF="${{ github.event.inputs.ref || github.event.client_payload.ref || github.ref }}"
          if [[ "$REF" == refs/tags/* ]] || [[ "$REF" == v* ]]; then
            if [[ "$REF" == refs/tags/* ]]; then
              VERSION=${REF#refs/tags/}
            else
              VERSION=$REF
            fi
            echo "VERSION=${VERSION}" >> $GITHUB_ENV
            echo "IS_TAG=true" >> $GITHUB_ENV
          else
            echo "IS_TAG=false" >> $GITHUB_ENV
          fi

      # 9. Build binary
      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -tags "osusergo,netgo,static_build" \
            -ldflags="-s -w -extldflags=-static" \
            -o ./bin/provider-services \
            ./cmd/provider-services

          chmod +x ./bin/provider-services

      # 10. Create Dockerfile
      - name: Create Dockerfile
        run: |
          cat > Dockerfile.binary << 'EOF'
          FROM alpine:3.18
          RUN apk add --no-cache ca-certificates
          COPY ./bin/provider-services /usr/local/bin/provider-services
          RUN chmod +x /usr/local/bin/provider-services
          ENTRYPOINT ["provider-services"]
          CMD ["run"]
          EOF

      # 11. Build and push Docker images
      - name: Build and push Docker images
        run: |
          if [ "${{ env.IS_TAG }}" == "true" ]; then
            # Build and push for tags
            docker buildx build \
              --platform linux/amd64 \
              --file ./Dockerfile.binary \
              --tag ${DOCKERHUB_IMAGE}:${VERSION} \
              --tag ${DOCKERHUB_IMAGE}:latest \
              --tag ${GHCR_IMAGE}:${VERSION} \
              --tag ${GHCR_IMAGE}:latest \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --label "org.opencontainers.image.revision=${COMMIT_SHA}" \
              --label "org.opencontainers.image.created=${BUILD_TIMESTAMP}" \
              --label "org.opencontainers.image.version=${VERSION}" \
              --push \
              .
          else
            # Build and push for main branch
            docker buildx build \
              --platform linux/amd64 \
              --file ./Dockerfile.binary \
              --tag ${DOCKERHUB_IMAGE}:main \
              --tag ${GHCR_IMAGE}:main \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --label "org.opencontainers.image.revision=${COMMIT_SHA}" \
              --label "org.opencontainers.image.created=${BUILD_TIMESTAMP}" \
              --push \
              .
          fi