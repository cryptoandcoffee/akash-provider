name: Docker Build and Push

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  repository_dispatch:
    types: [upstream-sync, release-build]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch or tag)'
        required: false
        default: 'main'
      tag_as_latest:
        description: 'Tag this build as latest'
        required: false
        type: boolean
        default: false

env:
  DOCKER_CLI_EXPERIMENTAL: "enabled"
  DOCKERHUB_IMAGE: cryptoandcoffee/akash-network-provider
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/akash-network-provider

jobs:
  build-binaries:
    runs-on: self-hosted
    steps:
      # 1. Checkout code with full history
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.event.client_payload.ref || github.ref }}

      # 2. Detect required Go version
      - name: Detect required Go version
        run: |
          toolchain=$(./script/tools.sh gotoolchain | sed 's/go*//')
          echo "GOVERSION=${toolchain}" >> $GITHUB_ENV

      # 3. Set up Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOVERSION }}

      # 4. Build binaries from source
      - name: Build binaries from source
        run: |
          # Set required environment variables
          export AKASH_DIRENV_SET=1
          export AP_ROOT=${{ github.workspace }}
          export GOTOOLCHAIN=go${{ env.GOVERSION }}

          # Build the binaries
          make bins
        env:
          BUILD_TAGS: "osusergo,netgo,static_build"
          GO_LINKMODE: external

      # 5. Upload binary artifact
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: provider-services-binary
          path: ./bin/provider-services

  docker-push:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.event.client_payload.ref || github.ref }}

      # 2. Download binary artifact
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: provider-services-binary
          path: ./bin/

      # 3. Generate build metadata
      - name: Generate build metadata
        run: |
          echo "BUILD_DATE=$(date -u +'%Y%m%d')" >> $GITHUB_ENV
          echo "BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "COMMIT_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
          chmod +x ./bin/provider-services

          # Determine ref type
          REF="${{ github.event.inputs.ref || github.event.client_payload.ref || github.ref }}"
          if [[ "$REF" == refs/tags/* ]] || [[ "$REF" == v* ]]; then
            if [[ "$REF" == refs/tags/* ]]; then
              VERSION=${REF#refs/tags/}
            else
              VERSION=$REF
            fi
            echo "VERSION=${VERSION}" >> $GITHUB_ENV
            echo "IS_TAG=true" >> $GITHUB_ENV
          else
            echo "IS_TAG=false" >> $GITHUB_ENV
          fi

      # 4. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 7. Create Dockerfile
      - name: Create Dockerfile
        run: |
          cat > Dockerfile.binary << 'EOF'
          FROM alpine:3.18
          RUN apk add --no-cache ca-certificates
          COPY ./bin/provider-services /usr/local/bin/provider-services
          RUN chmod +x /usr/local/bin/provider-services
          ENTRYPOINT ["provider-services"]
          CMD ["run"]
          EOF

      # 8. Build and push Docker images
      - name: Build and push Docker images for tags
        if: env.IS_TAG == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.binary
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ env.VERSION }}
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ env.VERSION }}
            ${{ env.GHCR_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT_SHA }}
            org.opencontainers.image.created=${{ env.BUILD_TIMESTAMP }}
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Build and push Docker images for main
        if: env.IS_TAG == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.binary
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:main
            ${{ env.GHCR_IMAGE }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT_SHA }}
            org.opencontainers.image.created=${{ env.BUILD_TIMESTAMP }}