name: Docker Build and Push

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  repository_dispatch:
    types: [upstream-sync, release-build]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch or tag)'
        required: false
        default: 'main'
      tag_as_latest:
        description: 'Tag this build as latest'
        required: false
        type: boolean
        default: false

env:
  DOCKER_CLI_EXPERIMENTAL: "enabled"
  DOCKERHUB_IMAGE: cryptoandcoffee/akash-network-provider
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/akash-network-provider

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      # 1. Checkout code with full history
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.event.client_payload.ref || github.ref }}

      # 2. Detect required Go version
      - name: Detect required Go version
        run: |
          toolchain=$(./script/tools.sh gotoolchain | sed 's/go*//')
          echo "GOVERSION=${toolchain}" >> $GITHUB_ENV

      # 3. Set up Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOVERSION }}

      # 4. Install Buildah
      - name: Install Buildah
        run: |
          if ! command -v buildah &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y buildah
          fi
          buildah --version

      # 5. Generate build metadata
      - name: Generate build metadata
        run: |
          echo "BUILD_DATE=$(date -u +'%Y%m%d')" >> $GITHUB_ENV
          echo "BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "COMMIT_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

          # Determine ref type
          REF="${{ github.event.inputs.ref || github.event.client_payload.ref || github.ref }}"
          if [[ "$REF" == refs/tags/* ]] || [[ "$REF" == v* ]]; then
            if [[ "$REF" == refs/tags/* ]]; then
              VERSION=${REF#refs/tags/}
            else
              VERSION=$REF
            fi
            echo "VERSION=${VERSION}" >> $GITHUB_ENV
            echo "IS_TAG=true" >> $GITHUB_ENV
          else
            echo "IS_TAG=false" >> $GITHUB_ENV
          fi

      # 6. Build binary
      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -tags "osusergo,netgo,static_build" \
            -ldflags="-s -w -extldflags=-static" \
            -o ./bin/provider-services \
            ./cmd/provider-services

          chmod +x ./bin/provider-services

      # 7. Create Dockerfile
      - name: Create Dockerfile
        run: |
          cat > Dockerfile.binary << 'EOF'
          FROM alpine:3.18
          RUN apk add --no-cache ca-certificates
          COPY ./bin/provider-services /usr/local/bin/provider-services
          RUN chmod +x /usr/local/bin/provider-services
          ENTRYPOINT ["provider-services"]
          CMD ["run"]
          EOF

      # 8. Build container with Buildah
      - name: Build container with Buildah
        run: |
          buildah bud -f Dockerfile.binary -t provider-temp .

      # 9. Push Docker images
      - name: Push Docker images
        run: |
          # Login to registries
          buildah login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}" docker.io
          buildah login -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}" ghcr.io

          if [ "${{ env.IS_TAG }}" == "true" ]; then
            # Tag and push for releases
            buildah tag provider-temp ${DOCKERHUB_IMAGE}:${VERSION}
            buildah tag provider-temp ${DOCKERHUB_IMAGE}:latest
            buildah tag provider-temp ${GHCR_IMAGE}:${VERSION}
            buildah tag provider-temp ${GHCR_IMAGE}:latest

            buildah push ${DOCKERHUB_IMAGE}:${VERSION}
            buildah push ${DOCKERHUB_IMAGE}:latest
            buildah push ${GHCR_IMAGE}:${VERSION}
            buildah push ${GHCR_IMAGE}:latest
          else
            # Tag and push for main branch
            buildah tag provider-temp ${DOCKERHUB_IMAGE}:main
            buildah tag provider-temp ${GHCR_IMAGE}:main

            buildah push ${DOCKERHUB_IMAGE}:main
            buildah push ${GHCR_IMAGE}:main
          fi